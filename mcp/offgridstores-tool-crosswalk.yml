description: >-
  Off Grid Stores publishes no OpenAPI, so the REST column of this crosswalk is the storefront JSON
  surface the store documents itself (/products.json, /collections/{handle}/products.json,
  /products/{handle}.json, /cart.js) and the primary contract column is the Storefront GraphQL
  schema. No published mapping exists between the MCP tools and the GraphQL root fields; every
  binding below was made by name and semantics and is graded accordingly.
