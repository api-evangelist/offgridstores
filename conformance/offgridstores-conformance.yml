generated: '2026-08-26'
method: probed
source: >-
  https://offgridstores.com/.well-known/ucp, https://offgridstores.com/.well-known/oauth-authorization-server,
  https://offgridstores.com/.well-known/oauth-protected-resource, live MCP initialize/tools/list and
  GraphQL introspection probes on 2026-08-26
description: >-
  Cross-cutting and domain standards Off Grid Stores' own contracts declare. Everything below is
  evidenced by a document served from an offgridstores.com URL or by a live response from an
  offgridstores.com endpoint; nothing is taken from a marketing claim.
standards:
- id: ucp
  name: Universal Commerce Protocol
  version: '2026-04-08'
  conforms: true
  domain_standard: true
  sector: commerce
  evidence:
    url: https://offgridstores.com/.well-known/ucp
    status: 200
    detail: >-
      The merchant profile declares ucp.version 2026-04-08 with supported_versions 2026-04-08 and
      2026-01-23, a dev.ucp.shopping service with transport "mcp" and endpoint /api/ucp/mcp plus an
      "embedded" transport, and capability URNs dev.ucp.shopping.checkout, .cart, .order,
      .fulfillment, .discount, .catalog.search and .catalog.lookup, each bound to a ucp.dev JSON
      Schema. It also declares the Shopify extension capability dev.shopify.catalog and three
      payment handlers (com.google.pay, dev.shopify.card, dev.shopify.shop_pay) with merchant_name
      "Off Grid Stores" and merchant_origin offgridstores.com. The live server echoes the version in
      the x-shopify-ucp-mcp-api-version response header.
- id: mcp
  name: Model Context Protocol
  version: '2025-06-18'
  conforms: true
  evidence:
    url: https://offgridstores.com/api/ucp/mcp
    status: 200
    detail: >-
      initialize returned protocolVersion 2025-06-18 with serverInfo universal-commerce 0.1.0 and
      tools/prompts/resources/logging capabilities. https://offgridstores.com/api/mcp returned the
      same protocol version with serverInfo storefront-renderer 0.1.0.
- id: jsonrpc2
  name: JSON-RPC 2.0
  conforms: true
  evidence:
    url: https://offgridstores.com/api/ucp/mcp
    status: 200
    detail: All MCP responses carry jsonrpc "2.0" with matching id, and errors use the standard code/message/data envelope.
- id: json-schema
  name: JSON Schema 2020-12
  conforms: true
  evidence:
    url: https://offgridstores.com/api/ucp/mcp
    status: 200
    detail: Every tool inputSchema declares $schema https://json-schema.org/draft/2020-12/schema.
- id: graphql
  name: GraphQL
  conforms: true
  evidence:
    url: https://offgridstores.com/api/2025-10/graphql.json
    status: 200
