description: >-
  Results of probing the /.well-known/ discovery surface on every host reachable from apis.yml.
  offgridstores.com is a Shopify-hosted storefront; the OAuth/OIDC metadata it serves is Shopify's
  customer-account authorization server bound to THIS shop (issuer
  https://shopify.com/authentication/55184621620, user-facing endpoints on account.offgridstores.com),
  and /.well-known/ucp is this merchant's own Universal Commerce Protocol profile naming Off Grid
  Stores as the merchant (merchant_name "Off Grid Stores", merchant_origin offgridstores.com,
  shop_id 55184621620). Paths that returned an HTML 404 page are recorded as absent and not saved.
