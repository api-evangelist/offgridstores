aid: offgridstores
name: Off Grid Stores - All Things Off-Grid Solar
description: >-
  Off Grid Stores is a US direct-to-consumer retailer of off-grid solar equipment — solar generators
  and kits, portable and rigid panels, LiFePO4 battery banks, inverters, charge controllers and
  composting toilets — operating from offgridstores.com. It publishes no traditional developer
  program, but its Shopify-hosted storefront exposes a substantial, entirely anonymous machine
  surface on its own domain: an agents.md/llms.txt agent contract (indexed by a dedicated
  /sitemap_agentic_discovery.xml), a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp declaring UCP 2026-04-08, two live Model Context Protocol servers (a 13-tool UCP
  commerce server and a 5-tool Storefront MCP server), an anonymously introspectable Storefront
  GraphQL API of 422 types, and the storefront JSON endpoints for products, collections and cart.
