apis:
- aid: offgridstores-ucp-commerce-mcp
  name: Off Grid Stores UCP Commerce MCP Server
  description: >-
    Universal Commerce Protocol (UCP) shopping service, exposed over MCP at
    https://offgridstores.com/api/ucp/mcp. The server identifies itself as "universal-commerce" 0.1.0
    speaking MCP protocol 2025-06-18 and UCP 2026-04-08. tools/list answers anonymously with 13 tools
    covering catalog search/lookup, cart create/read/update/cancel, checkout
    create/read/update/complete/cancel, and order lookup. Every tools/call requires a resolvable UCP
    agent profile URI, complete_checkout additionally requires an idempotency key, and checkout
    completion requires contemporaneous buyer approval.
  humanURL: https://offgridstores.com/agents.md
  baseURL: https://offgridstores.com/api/ucp/mcp
  tags:
  - MCP
  - UCP
  - Commerce
  - Checkout
  - Cart
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/offgridstores-mcp.yml
  - type: ToolCrosswalk
    url: mcp/offgridstores-tool-crosswalk.yml
  - type: Documentation
    url: https://offgridstores.com/agents.md
- aid: offgridstores-storefront-mcp
  name: Off Grid Stores Storefront MCP Server
  description: >-
    Shopify Storefront MCP server at https://offgridstores.com/api/mcp, identifying itself as
    "storefront-renderer" 0.1.0 on MCP protocol 2025-06-18. Five tools that answer anonymously end to
    end — search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs. A live tools/call for "solar generator" returned real Off Grid
    Stores product records during the 2026-08-26 probe.
  humanURL: https://offgridstores.com/agents.md
  baseURL: https://offgridstores.com/api/mcp
  tags:
  - MCP
  - Catalog
  - Cart
  - Policies
  properties:
  - type: MCPServer
    url: mcp/offgridstores-mcp.yml
- aid: offgridstores-storefront-graphql
  name: Off Grid Stores Storefront GraphQL API
  description: >-
    Shopify Storefront GraphQL API served on the company's own host at
    https://offgridstores.com/api/2025-10/graphql.json. Full introspection answers anonymously: 422
    types, 34 query root fields and 41 mutations covering products, collections, blogs, pages, menus,
    search, cart lifecycle and customer accounts. Query cost is returned in extensions.cost.
  humanURL: https://offgridstores.com/llms.txt
  baseURL: https://offgridstores.com/api/2025-10/graphql.json
  tags:
  - GraphQL
  - Storefront
  - Commerce
  - Catalog
  properties:
  - type: GraphQL
    url: graphql/offgridstores-storefront.graphql
  - type: Introspection
    url: graphql/offgridstores-storefront-introspection.json
  - type: DataModel
    url: data-model/offgridstores-data-model.yml
- aid: offgridstores-storefront-json
  name: Off Grid Stores Storefront JSON Endpoints
  description: >-
    Anonymous read-only JSON over the storefront: /products.json and /collections.json for the
    catalog, /products/{handle}.json and /collections/{handle}/products.json for single resources,
    and /cart.js for the session cart. Documented in the store's own /agents.md and /llms.txt, and
    verified paging on limit/page during the 2026-08-26 probe.
  humanURL: https://offgridstores.com/llms.txt
  baseURL: https://offgridstores.com
  tags:
  - JSON
  - Catalog
  - Cart
