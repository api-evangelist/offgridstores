description: >-
  Off Grid Stores sells off-grid solar equipment, not API access. There is no developer plan, no API
  pricing page, no key issuance and no paid tier for any of its machine surfaces: the Storefront
  GraphQL API, the storefront JSON endpoints and the /api/mcp Storefront MCP server all answered
  anonymously, and the /api/ucp/mcp UCP server gates only tool invocation behind a UCP agent
  profile, which costs nothing. The money on this surface is the retail cart, not a subscription.
