commercial_note: >-
  Merchandise pricing is real and is exposed programmatically through the same surfaces —
  search_catalog and /products.json return prices in the currency's ISO 4217 minor units paired with
  a currency code, and the store's paymentSettings report USD/US with VISA, MASTERCARD,
  AMERICAN_EXPRESS, DISCOVER and DINERS_CLUB accepted plus SHOPIFY_PAY, APPLE_PAY and GOOGLE_PAY
  wallets. That is merchandise pricing, not API pricing, so it is deliberately not recorded here as
  a plan. The store also runs a consumer loyalty programme at /pages/off-grid-plus-program and a
  best-price guarantee at /pages/best-price-guarantee; neither is an API plan.
